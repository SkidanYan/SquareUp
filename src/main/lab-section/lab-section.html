
<section class="lab-section">
  <div class="container lab-section__inner">

    <form class="form" action="https://httpbin.org/post" method="POST">
      <h2 class="form__title h4">Вход в систему</h2>
      
      <div class="form__group">
        <label class="form__label" for="login">Логин</label>
        <input class="form__input" type="text" id="login" name="login" required>
      </div>
      
      <div class="form__group">
        <label class="form__label" for="password">Пароль</label>
        <input class="form__input" type="password" id="password" name="password" required>
      </div>
      
      <div class="form__checkbox-group">
        <input class="form__checkbox" type="checkbox" id="remember" name="remember">
        <label class="form__label" for="remember">Запомнить меня</label>
      </div>
      
      <button class="form__submit button button-accent" type="submit">Войти</button>
    </form>

    <form class="form" action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
      <h2 class="form__title h4">Обратная связь</h2>
      
      <div class="form__group">
        <label class="form__label" for="fio">ФИО</label>
        <input class="form__input" type="text" id="fio" name="fio" required>
      </div>
      
      <div class="form__group">
        <label class="form__label" for="email">Email</label>
        <input class="form__input" type="email" id="email" name="email" required>
      </div>
      
      <fieldset class="form__fieldset">
        <legend class="form__label">Откуда узнали о нас?</legend>
        <div class="form__radio-group">
          <input class="form__radio" type="radio" id="source-net" name="source" value="internet" checked>
          <label class="form__label" for="source-net">Из интернета</label>
        </div>
        <div class="form__radio-group">
          <input class="form__radio" type="radio" id="source-friends" name="source" value="friends">
          <label class="form__label" for="source-friends">От друзей</label>
        </div>
      </fieldset>

      <div class="form__group">
        <label class="form__label" for="type">Тип обращения</label>
        <select class="form__select" id="type" name="type">
          <option value="complaint">Жалоба</option>
          <option value="suggestion">Предложение</option>
        </select>
      </div>

      <div class="form__group">
        <label class="form__label" for="message">Текст сообщения</label>
        <textarea class="form__textarea" id="message" name="message" rows="4" required></textarea>
      </div>

      <div class="form__group">
        <label class="form__label" for="file">Прикрепить файл</label>
        <input class="form__file" type="file" id="file" name="file">
      </div>

      <div class="form__checkbox-group">
        <input class="form__checkbox" type="checkbox" id="consent" name="consent" required>
        <label class="form__label" for="consent">Даю согласие на обработку персональных данных</label>
      </div>

      <button class="form__submit button button-accent" type="submit">Отправить</button>
    </form>

    

  </div>

</section>
<table class="dummy-table">
  <tr>
    <th>Услуга</th>
    <th>Срок выполнения</th>
  </tr>
  <tr>
    <td>Разработка сайта</td>
    <td>от 14 дней</td>
  </tr>
  <tr>
    <td>UI/UX Дизайн</td>
    <td>от 7 дней</td>
  </tr>
</table>
